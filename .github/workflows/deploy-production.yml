name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Runs ON the VPS (self-hosted runner). GitHub cloud runners cannot SSH to your
# server because Hostinger blocks inbound port 22 from GitHub IP ranges.

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync to app directory
        run: |
          set -euo pipefail
          APP_DIR="/opt/mafateehwebsite"
          rsync -az --delete \
            --filter='protect deploy/certbot/' \
            --filter='protect deploy/config/backend.env' \
            --filter='protect deploy/config/postgres.env' \
            --filter='protect deploy/nginx/conf.d/' \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "backend/node_modules" \
            --exclude "website/node_modules" \
            --exclude "admin-dashboard/node_modules" \
            --exclude "backend/.env" \
            --exclude "deploy/certbot/" \
            --exclude "deploy/config/backend.env" \
            --exclude "deploy/config/postgres.env" \
            --exclude "deploy/nginx/conf.d/" \
            "./" "${APP_DIR}/"

      - name: Deploy
        run: bash /opt/mafateehwebsite/deploy/scripts/deploy.sh
