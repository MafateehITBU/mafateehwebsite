name: Deploy Production

# Production deploy runs ON THE VPS (not from GitHub cloud).
# GitHub cloud cannot SSH to your server (Hostinger blocks port 22).
#
# Setup once on server (choose one):
#   A) Git auto-pull: add deploy key + bash deploy/scripts/setup-git-deploy.sh
#   B) Self-hosted runner: bash deploy/scripts/setup-github-runner.sh TOKEN
#
# This workflow is informational only — it does not deploy.

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy runs on VPS
        run: |
          echo "Production deploy is configured on the VPS at /opt/mafateehwebsite"
          echo ""
          echo "Option A — Git auto-pull (every 3 min after setup):"
          echo "  1. Add deploy key: https://github.com/MafateehITBU/mafateehwebsite/settings/keys/new"
          echo "  2. ssh root@187.124.173.216"
          echo "  3. bash /opt/mafateehwebsite/deploy/scripts/setup-git-deploy.sh"
          echo ""
          echo "Option B — Instant deploy via self-hosted runner:"
          echo "  bash /opt/mafateehwebsite/deploy/scripts/setup-github-runner.sh TOKEN"
          echo "  Then enable .github/workflows/deploy-self-hosted.yml push trigger"
