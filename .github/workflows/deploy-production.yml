name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# STOP "Waiting for a runner": install the VPS runner once, then uncomment the
# self-hosted job below and remove/disable the fail-fast job.
#
#   bash deploy/scripts/setup-github-runner.sh <TOKEN>
#   https://github.com/MafateehITBU/mafateehwebsite/settings/actions/runners/new
#
# Until then, use git pull on the server (after adding deploy key):
#   bash deploy/scripts/setup-git-deploy.sh

jobs:
  # Remove this job after self-hosted runner is installed.
  runner-not-installed:
    runs-on: ubuntu-latest
    steps:
      - name: Self-hosted runner required
        run: |
          echo "::error::No self-hosted runner on this VPS — job would wait forever."
          echo "::error::Install: ssh root@187.124.173.216 then bash deploy/scripts/setup-github-runner.sh TOKEN"
          echo "::error::Or use git auto-deploy: add deploy key at https://github.com/MafateehITBU/mafateehwebsite/settings/keys/new then bash deploy/scripts/setup-git-deploy.sh"
          exit 1

