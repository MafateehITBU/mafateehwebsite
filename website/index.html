<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-mafateeh.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/decor-hand.webp" type="image/webp" fetchpriority="high" />
    <title>Mafateeh Group</title>
    <meta name="description" content="Mafateeh Group — IT, digital marketing, and branding solutions." />
    <link rel="canonical" href="https://www.mafateehgroup.com/en/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mafateeh Group" />
    <meta property="og:title" content="Mafateeh Group" />
    <meta property="og:description" content="Mafateeh Group — IT, digital marketing, and branding solutions." />
    <meta property="og:url" content="https://www.mafateehgroup.com/en/" />
    <meta property="og:image" content="https://www.mafateehgroup.com/logo-mafateeh.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.mafateehgroup.com/#organization",
        "name": "Mafateeh Group",
        "url": "https://www.mafateehgroup.com",
        "logo": "https://www.mafateehgroup.com/logo-mafateeh.png",
        "foundingDate": "2018",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Amman",
          "addressCountry": "JO"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+962-7-7060-9728",
          "email": "info@mafateehgroup.com",
          "contactType": "customer service"
        }
      }
    </script>
    <script>
      try {
        if (localStorage.getItem('mafateeh-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
        var locale = localStorage.getItem('mafateeh-locale')
        if (locale === 'ar' || locale === 'en') {
          document.documentElement.lang = locale
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr'
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
