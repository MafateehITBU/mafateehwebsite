server {
    listen 80;
    server_name mafateehgroup.com www.mafateehgroup.com dashboard.mafateehgroup.com www.dashboard.mafateehgroup.com api.mafateehgroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
