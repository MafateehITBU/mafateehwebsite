server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Canonical host redirect (apex -> www over HTTPS)
    if ($host = mafateehgroup.com) {
        return 301 https://www.mafateehgroup.com$request_uri;
    }

    # Exact static SEO files (must not fall through to SPA shell)
    location = /robots.txt {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /site.webmanifest {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.ico {
        try_files $uri /favicon.svg =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # Static root files (logos, icons) — 30-day cache at CDN/origin
    location ~* ^/(logo-mafateeh\.(png|webp)|decor-hand(-sm)?\.webp|favicon\.svg|icons\.svg)$ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=2592000";
        add_header CDN-Cache-Control "public, max-age=2592000";
    }

    # Hashed Vite assets — long cache (Cloudflare respects CDN-Cache-Control)
    location /assets/ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header CDN-Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA shell — do not cache at edge (locale routes change client-side)
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }

    # Legacy /blog → /blogs
    location = /blog {
        return 301 /en/blogs;
    }

    location = /contact-us {
        return 301 /en/contact;
    }

    # Unprefixed pages → default English locale (SEO canonical paths use /en|/ar)
    location ~ ^/(about|it-solutions|digital-marketing|branding|packages|blogs|contact|privacy-policy|terms-and-conditions|cookie-policy|accessibility)(/|$) {
        return 301 /en$uri;
    }

    # Common probe / CMS paths — real 404 (not SPA soft-404)
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|admin|administrator|\.env|phpmyadmin)(/|$) {
        return 404;
    }

    location = / {
        return 301 /en/;
    }

    # Locale routes — only pre-generated HTML shells (invalid paths → 404)
    location = /en {
        return 301 /en/;
    }

    location = /ar {
        return 301 /ar/;
    }

    location ~ ^/(en|ar)(/.*)?$ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Unknown root paths — real 404 (not SPA shell)
    location / {
        return 404;
    }
}
